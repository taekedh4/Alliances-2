<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alliances</title>
<style>
:root{--ink:#e9f0e2;--moss:#1f3a27;--dark:#254a30;--light:#5f8566;--paper:#d3e6bd;--paperink:#1d3322;--gold:#e0b341;--red:#d9453d;--cell:46px}
*{box-sizing:border-box}
body{margin:0;background:#16281b;color:var(--ink);font:15px/1.4 Georgia,'Palatino Linotype',serif}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#hist{position:fixed;inset:0;background:rgba(8,16,9,.88);z-index:8;display:flex;justify-content:center;padding:16px}
#hist .box{background:#10200f;border:1px solid #2b4a31;border-radius:12px;max-width:560px;width:100%;display:flex;flex-direction:column}
#hist .head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #254a30}
#hist .body{overflow:auto;padding:8px 16px 16px}
#hist h4{margin:14px 0 4px;color:var(--gold)}
#hist .ln{padding:2px 0;font-size:14px;border-bottom:1px solid #1d3624}
.hidden{display:none!important}
#login{max-width:340px;margin:12vh auto;padding:24px;text-align:center}
#login h1{font-size:44px;margin:0 0 4px;letter-spacing:.5px}
#login input{width:100%;padding:12px;margin:12px 0;border-radius:8px;border:2px solid var(--light);background:#10200f;color:var(--ink);text-align:center;font-size:22px;letter-spacing:6px}
.btn{background:var(--paper);color:var(--paperink);border:0;border-radius:8px 10px 8px 12px;padding:9px 14px;cursor:pointer;font-weight:bold}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--light)}
#err{color:#ffb4a8;min-height:22px}
#app{display:grid;grid-template-columns:1fr 330px;height:100vh}
#boardwrap{overflow:auto;padding:16px;position:relative}
#toolbar{position:sticky;left:0;top:0;display:flex;gap:6px;margin-bottom:10px;z-index:3}
#board{display:grid;width:max-content;padding:8px;background:#183222;border-radius:6px;gap:3px;
 background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 7px)}
.c{width:var(--cell);height:var(--cell);position:relative;cursor:pointer;display:grid;place-items:center;border-radius:2px}
.c.l{background:var(--light)}.c.d{background:var(--dark)}
.c.out{background:#0c170e;cursor:default}
.c.move{outline:2px dashed var(--gold);outline-offset:-4px}
.c.shot{box-shadow:inset 0 0 0 2px rgba(255,138,118,.95);background-image:linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,.14))}
.c.sel{box-shadow:inset 0 0 0 3px #fff}
.pc{width:80%;height:80%;border-radius:4px;display:grid;place-items:center;font-weight:bold;color:#10200f;border:3px solid #0d0d0d;font-size:15px}
.pc.dead{filter:grayscale(1);opacity:.55}
.pc.me{box-shadow:0 0 0 3px var(--gold)}
.tag{position:absolute;bottom:100%;left:50%;transform:translate(-50%,2px);background:var(--paper);color:var(--paperink);border-radius:8px 6px 9px 5px;padding:1px 6px;font-size:11px;white-space:nowrap;z-index:2;pointer-events:none;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.tag b{color:var(--red)}
.heart{font-size:24px;color:var(--red);filter:drop-shadow(0 0 4px rgba(255,120,120,.7));animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
@media(prefers-reduced-motion:reduce){.heart{animation:none}}
aside{background:#10200f;border-left:1px solid #2b4a31;padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.ap{font-size:42px;color:var(--gold);line-height:1}
.card{background:#193021;border-radius:10px;padding:12px}
.card h3{margin:0 0 8px;font-size:16px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.plist div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #254a30;cursor:pointer}
.plist .dead{opacity:.5;text-decoration:line-through}
#notes{max-height:200px;overflow:auto;font-size:13px}
#notes div{padding:3px 0;border-bottom:1px solid #254a30}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#d9453d;color:#fff;padding:8px 14px;border-radius:8px;z-index:9}
@media(max-width:800px){#toolbar{flex-wrap:wrap}#toolbar .btn{padding:6px 10px;font-size:13px}#app{grid-template-columns:1fr;grid-template-rows:55vh 1fr;height:auto}aside{border-left:0;border-top:1px solid #2b4a31}:root{--cell:40px}}
</style></head><body>
<div id="login"><h1>Alliances</h1><div>Enter your 7-digit code</div>
 <input id="code" inputmode="numeric" maxlength="7" autocomplete="off" aria-label="7-digit code">
 <button class="btn" id="go">Enter</button> <button class="btn alt" id="adm">Admin</button><div id="err" role="alert"></div></div>
<div id="app" class="hidden"><div id="boardwrap"><div id="toolbar"><button class="btn alt" id="zi">Zoom +</button><button class="btn alt" id="zo">Zoom −</button><button class="btn alt" id="ctr">Find me</button><button class="btn alt" id="hbtn">History</button><button class="btn alt" id="out">Log out</button></div><div id="board"></div></div><aside id="side"></aside></div>
<div id="hist" class="hidden" role="dialog" aria-label="Game history"><div class="box"><div class="head"><b>Game history</b><button class="btn alt" id="hx">Close</button></div><div class="body" id="hbody"></div></div></div>
<div id="toast" class="hidden"></div>
<script>
const $=s=>document.querySelector(s);let token=localStorage.t||'',S=null,sel=null,mode=null,cell=46,adminMode=false;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,body){const r=await fetch(p,{method:body?'POST':'GET',headers:{authorization:'Bearer '+token},body:body&&JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||'Error');return j}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2800)}
async function login(path){$('#err').textContent='';try{const j=await (await fetch(path,{method:'POST',body:JSON.stringify({code:$('#code').value})})).json();if(!j.token)throw Error(j.error);token=j.token;localStorage.t=token;start()}catch(e){$('#err').textContent=e.message||'Login failed'}}
$('#go').onclick=()=>login('/api/login');$('#adm').onclick=()=>login('/api/admin/login');
$('#code').onkeydown=e=>{if(e.key==='Enter')login('/api/login')};
$('#out').onclick=()=>{localStorage.removeItem('t');location.reload()};
$('#hx').onclick=()=>$('#hist').classList.add('hidden');
$('#hbtn').onclick=async()=>{try{const j=await api('/api/history'),by={};for(const e of j.days)(by[e.day]=by[e.day]||[]).push(e);
 $('#hbody').innerHTML=Object.keys(by).sort((a,b)=>b-a).map(d=>`<h4>${d==0?'Before day 1':'Day '+d}</h4>`+by[d].slice().reverse().map(e=>`<div class="ln">${esc(e.text)}</div>`).join('')).join('')||'Nothing has happened yet.';
 $('#hist').classList.remove('hidden')}catch(e){toast(e.message)}};
$('#ctr').onclick=()=>{const m=document.querySelector('.pc.me')||document.querySelector('.pc');if(m)m.scrollIntoView({block:'center',inline:'center',behavior:'smooth'})};
$('#zi').onclick=()=>{cell=Math.min(80,cell+6);render()};$('#zo').onclick=()=>{cell=Math.max(20,cell-6);render()};
// Range rules mirror server/rules.js for highlighting only; the server decides every action.
const inRange=(lv,dx,dy)=>{dx=Math.abs(dx);dy=Math.abs(dy);return (dx||dy)&&Math.max(dx,dy)<=3+lv};
const color=id=>`hsl(${(id*67)%360} 55% 62%)`;
async function refresh(){try{S=await api('/api/state');adminMode=S.role==='admin';$('#login').classList.add('hidden');$('#app').classList.remove('hidden');render()}catch(e){if(/log in/i.test(e.message)){localStorage.removeItem('t');location.reload()}}}
function start(){refresh();const es=new EventSource('/api/events?t='+encodeURIComponent(token));es.onmessage=refresh}
function render(){adminMode?renderAdmin():renderPlayer()}
function renderBoard(P,me){
 const b=S.bounds||S.game.bounds,HS=S.hearts||(S.game&&S.game.hearts)||[],w=b.x1-b.x0+1,h=b.y1-b.y0+1,el=$('#board');
 el.style.gridTemplateColumns=`repeat(${w},${cell}px)`;el.style.setProperty('--cell',cell+'px');
 const at=(x,y)=>P.find(p=>p.x===x&&p.y===y),sp=sel!=null?P.find(p=>p.id===sel):null;
 let html='';
 for(let y=b.y0;y<=b.y1;y++)for(let x=b.x0;x<=b.x1;x++){
  const p=at(x,y),hh=HS.find(q=>q.x===x&&q.y===y);let cls='c '+((x+y)%2?'l':'d');
  if(me&&sel===me.id&&me.alive){const dx=x-me.x,dy=y-me.y;
   if(Math.abs(dx)+Math.abs(dy)===1&&!p)cls+=' move';if(inRange(me.rangeLevel,dx,dy))cls+=' shot'}
  if(p&&p.id===sel)cls+=' sel';
  html+=`<div class="${cls}" data-x="${x}" data-y="${y}" title="(${x},${y})">`;
  if(p){const ap=(p.ap!=null)?` · <b>${p.ap} AP</b>`:'';html+=`<div class="tag">${p.alive?'':'dead'}${'♥'.repeat(Math.min(p.hearts,6))}${p.hearts>6?'+'+(p.hearts-6):''}${ap}</div><div class="pc ${p.alive?'':'dead'} ${me&&p.id===me.id?'me':''}" style="background:${color(p.id)}">${esc(p.name[0]||'?').toUpperCase()}</div>`}
  else if(hh)html+='<span class="heart">♥</span>';
  html+='</div>'}
 el.innerHTML=html;
 el.onclick=e=>{const c=e.target.closest('.c');if(!c)return;const x=+c.dataset.x,y=+c.dataset.y,p=at(x,y);
  if(p){sel=sel===p.id?null:p.id;render();return}
  if(adminMode){const hh=HS.find(q=>q.x===x&&q.y===y);
   if(hh){if(confirm('Remove the heart at ('+x+','+y+')?'))adm('removeHeart',{id:hh.id});return}
   if(sel!=null&&confirm('Move the selected player to ('+x+','+y+')?'))adm('move',{id:sel,x,y});return}
  if(me&&c.classList.contains('move'))act({type:'move',x,y})}}
async function act(a){try{await api('/api/action',a);await refresh()}catch(e){toast(e.message)}}

const ord=n=>n+(['th','st','nd','rd'][(n%100>>3^1&&n%10<4)?n%10:0]||'th');
function resultCard(r){return r?`<div class="card" style="border:2px solid var(--gold)"><h3>Final results</h3>${r.ranking.map(x=>`<div>${ord(x.place)} · ${esc(x.name)}</div>`).join('')}</div>`:''}
function negCard(N,P,me){
 if(!N)return '';const name=id=>esc((P.find(p=>p.id===id)||{}).name||'?'),inN=me&&N.participants.includes(me.id),pr=N.proposal;
 let h=`<div class="card"><h3>Final ranking talks</h3><div>${N.participants.length} players remain. If all of them accept the same ranking, the game ends.</div>`;
 h+=pr?`<div style="margin-top:6px">Proposed by ${name(pr.by)}:</div>${pr.ranking.map((id,i)=>`<div>${ord(i+1)} · ${name(id)}</div>`).join('')}
 <div style="margin-top:6px">${N.participants.map(id=>`${name(id)} ${N.votes[id]===true?'✓ accepted':N.votes[id]===false?'✗ rejected':'… waiting'}`).join('<br>')}</div>`:'<div style="margin-top:6px">No proposal yet.</div>';
 if(inN){if(pr)h+=`<div class="row"><button class="btn" id="acc">Accept</button><button class="btn alt" id="rej">Reject</button></div>`;
  h+=`<div style="margin-top:8px">Propose a ranking:</div>${N.participants.map((id,i)=>`<div class="row">${name(id)} <select class="pl" data-id="${id}">${N.participants.map((_,k)=>`<option value="${k+1}" ${k===i?'selected':''}>${ord(k+1)}</option>`).join('')}</select></div>`).join('')}
  <div class="row"><button class="btn" id="prop">Submit proposal</button></div>`}
 return h+'</div>'}
function bindNeg(N){
 const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
 on('#acc',()=>act({type:'respond',accept:true}));on('#rej',()=>act({type:'respond',accept:false}));
 on('#prop',()=>{const sl=[...document.querySelectorAll('select.pl')],pl=sl.map(x=>+x.value);
  if(new Set(pl).size!==pl.length)return toast('Give each player a different place');
  act({type:'propose',ranking:sl.map((x,i)=>({id:+x.dataset.id,p:pl[i]})).sort((a,b)=>a.p-b.p).map(x=>x.id)})})}
function renderPlayer(){
 const P=S.players,me=P.find(p=>p.id===S.me);renderBoard(P,me);
 const t=sel!=null?P.find(p=>p.id===sel):null,other=t&&t.id!==me.id;
 const dx=other?t.x-me.x:0,dy=other?t.y-me.y:0,reach=other&&me.alive&&inRange(me.rangeLevel,dx,dy);
 me.jury_eligible=S.jury&&S.jury.me.eligible;const ap=me.ap??0,off=S.phase!=='running'||!me.alive;
 let h=`<div class="card"><h3>${esc(me.name)} ${me.alive?'':'(dead)'}</h3><div class="ap">${ap} AP</div>
 <div>${'♥'.repeat(Math.min(me.hearts,12))||'—'} ${me.hearts} hearts</div>
 <div>Range ${me.range.n} (${2*me.range.n+1}×${2*me.range.n+1} square) · position (${me.x},${me.y})</div>
 <div>${S.phase==='lobby'?'Waiting for the game to start':'Day '+S.day}</div>
 <div class="row"><button class="btn" id="heal" ${off||ap<3?'disabled':''}>Add heart (3 AP)</button>
 <button class="btn" id="up" ${off||ap<2?'disabled':''}>Upgrade range (2 AP)</button></div>
 <div style="margin-top:6px;font-size:13px">Click yourself to see moves (dashed) and shots (red). Click a dashed square to move (1 AP).</div></div>`;
 if(other)h+=`<div class="card"><h3>${esc(t.name)} ${t.alive?'':'(dead)'}</h3><div>${t.hearts} hearts · range ${t.range.n}</div>
 <div>Position (${t.x},${t.y}) · ${reach?'in your range':'out of your range'}</div>
 <div class="row"><button class="btn" id="shoot" ${off||ap<1||!reach||!t.alive?'disabled':''}>Shoot (1 AP)</button>
 <button class="btn" id="gh" ${off||!reach||me.hearts<2||t.permanentlyEliminated?'disabled':''}>Send 1 heart</button>
 <button class="btn" id="ga" ${off||!reach||ap<1||!t.alive?'disabled':''}>Send 1 AP</button></div></div>`;
 h=resultCard(S.result)+h+(S.phase==='ended'?'':negCard(S.negotiation,P,me));
 if(me.jury_eligible){const v=S.jury.me.votedFor,vp=P.find(p=>p.id===v);
  h+=`<div class="card"><h3>Jury</h3><div>${v?'You voted for '+esc(vp.name)+'. The result is announced when voting closes.':'Vote for one living player to haunt. A haunted player gets no AP at 17:00.'}</div>
  <div class="row">${P.filter(p=>p.alive).map(p=>`<button class="btn" data-vote="${p.id}" ${v?'disabled':''}>${esc(p.name)}</button>`).join('')||'No living players'}</div></div>`}
 h+=`<div class="card"><h3>Players</h3><div class="plist">${P.map(p=>`<div class="${p.alive?'':'dead'}" data-id="${p.id}"><span>${esc(p.name)}</span><span>${p.hearts} ♥ · r${p.range.n}</span></div>`).join('')}</div></div>
 <div class="card"><h3>Notifications</h3><div id="notes">${(S.notes||[]).slice().reverse().map(n=>`<div>${esc(n.text)}</div>`).join('')||'Nothing yet'}</div></div>`;
 $('#side').innerHTML=h;bindNeg(S.negotiation);
 const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
 on('#heal',()=>act({type:'heal'}));on('#up',()=>act({type:'upgrade'}));
 on('#shoot',()=>{if(confirm('Shoot '+t.name+'?'))act({type:'shoot',target:t.id})});
 on('#gh',()=>{if(confirm('Send 1 heart to '+t.name+'?'))act({type:'gift',kind:'hearts',amount:1,target:t.id})});
 on('#ga',()=>{if(confirm('Send 1 AP to '+t.name+'?'))act({type:'gift',kind:'ap',amount:1,target:t.id})});
 document.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>{const p=P.find(q=>q.id==b.dataset.vote);if(confirm('Vote to haunt '+p.name+'? You cannot change your vote.'))act({type:'vote',target:p.id})});
 document.querySelectorAll('.plist div').forEach(d=>d.onclick=()=>{sel=+d.dataset.id;render()})}
async function adm(cmd,extra={}){try{await api('/api/admin/do',{cmd,...extra});await refresh()}catch(e){
 if(/^CONFIRM: /.test(e.message)){if(confirm(e.message.slice(9)))adm(cmd,{...extra,confirm:true})}else toast(e.message)}}
function renderAdmin(){
 const G=S.game,P=G.players,b=G.bounds,W=b.x1-b.x0+1,H=b.y1-b.y0+1,st=G.settings,t=P.find(p=>p.id===sel),ph=G.phase;
 renderBoard(P,null);
 const num=(id,v,w='70px')=>`<input id="${id}" value="${v??''}" inputmode="numeric" style="width:${w};padding:6px">`;
 let h=`<div class="card"><h3>Game: ${ph} · day ${G.day} · ${W}×${H}</h3><div class="row">
 <button class="btn" data-c="start" ${ph!=='lobby'?'disabled':''}>Start</button><button class="btn" data-c="pause" ${ph!=='running'?'disabled':''}>Pause</button>
 <button class="btn" data-c="resume" ${ph!=='paused'?'disabled':''}>Resume</button><button class="btn alt" data-c="end">End</button><button class="btn alt" data-c="reset">Reset</button></div></div>
 <div class="card"><h3>Add player</h3><input id="pn" placeholder="Name" style="width:100%;margin-bottom:6px;padding:8px"><input id="pc" placeholder="7-digit code" maxlength="7" inputmode="numeric" style="width:100%;padding:8px">
 <div class="row"><button class="btn" id="add" ${ph!=='lobby'?'disabled':''}>Add player</button></div></div>`;
 h+=resultCard(G.result);
 if(G.negotiation)h+=`<div class="card"><h3>Final ranking talks</h3>${G.negotiation.proposal?'Proposal by '+esc((P.find(p=>p.id===G.negotiation.proposal.by)||{}).name)+' · '+G.negotiation.participants.map(id=>esc((P.find(p=>p.id===id)||{}).name)+(G.negotiation.votes[id]===true?' ✓':G.negotiation.votes[id]===false?' ✗':' …')).join(', '):'No proposal yet'}</div>`;
 if(t)h+=`<div class="card"><h3>${esc(t.name)} ${t.alive?'':'(dead'+(t.permanentlyEliminated?', permanent':'')+')'}</h3>
 <div>${t.hearts} hearts · ${t.ap} AP · range ${t.rangeLevel} · (${t.x},${t.y})</div>
 <div class="row">Hearts ${num('ah','1','50px')}<button class="btn" id="hp">+</button><button class="btn alt" id="hm">−</button> AP ${num('aa','1','50px')}<button class="btn" id="ap1">+</button><button class="btn alt" id="am">−</button></div>
 <div class="row">Range level ${num('rl',t.rangeLevel,'50px')}<button class="btn" id="rls">Set</button></div>
 <div class="row"><input id="rn" value="${esc(t.name)}" style="width:110px;padding:6px"><button class="btn" id="rnb">Rename</button>${num('nc','','90px')}<button class="btn" id="ncb">New code</button></div>
 <div class="row"><button class="btn" id="rev" ${t.alive||t.permanentlyEliminated?'disabled':''}>Revive</button><button class="btn alt" id="eli">Eliminate</button><button class="btn alt" id="rem">Remove</button></div>
 <div style="font-size:13px;margin-top:6px">To move: click an empty square on the board.</div></div>`;
 else h+=`<div class="card">Select a player on the board or in the list to manage them.</div>`;
 h+=`<div class="card"><h3>Grid and hearts</h3><div class="row">${num('gw',W,'55px')}×${num('gh2',H,'55px')}<button class="btn" id="rz">Resize</button><button class="btn alt" id="sn">Shrink now</button></div>
 <div class="row"><button class="btn" id="sp">Spawn heart</button></div><div style="font-size:13px">Click a heart on the board to remove it. ${G.hearts.length} on the board.</div></div>
 <div class="card"><h3>Settings</h3><div class="row">AP per day ${num('s_ap',st.apPerDay,'50px')} Max hearts ${num('s_mh',st.maxHearts??'','50px')}</div>
 <div class="row">Heal cost ${num('s_hc',st.healCost,'50px')} Upgrade cost ${num('s_uc',st.upgradeCost,'50px')}</div>
 <div class="row"><label><input type="checkbox" id="s_sh" ${st.shrinkEnabled?'checked':''}> Shrinking grid</label> every ${num('s_se',st.shrinkEvery??3,'50px')} days</div>
 <div class="row">Jury closes at <input id="s_jc" type="time" value="${String(Math.floor((st.juryCloseMinutes??1015)/60)).padStart(2,'0')}:${String((st.juryCloseMinutes??1015)%60).padStart(2,'0')}">
 <select id="s_em"><option value="top3" ${st.endgameMode!=='last'?'selected':''}>Top three</option><option value="last" ${st.endgameMode==='last'?'selected':''}>Last standing</option></select></div>
 <div class="row"><button class="btn" id="sv">Save settings</button></div></div>
 <div class="card"><h3>Players (admin sees AP)</h3><div class="plist">${P.map(p=>`<div class="${p.alive?'':'dead'}" data-id="${p.id}"><span>${esc(p.name)} (${p.x},${p.y})</span><span>${p.hearts} ♥ · ${p.ap} AP</span></div>`).join('')||'No players yet'}</div></div>
 <div class="card"><h3>Activity log</h3><div id="notes">${(S.log||[]).slice().reverse().map(l=>`<div>${new Date(l.ts).toLocaleString('nl-NL')} · ${esc(l.text)}</div>`).join('')||'Nothing yet'}</div></div>`;
 $('#side').innerHTML=h;
 const v=id=>$(id).value,n=id=>Number(v(id)),on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
 document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>adm(b.dataset.c));
 document.querySelectorAll('.plist div').forEach(d=>d.onclick=()=>{sel=+d.dataset.id;render()});
 on('#add',()=>adm('addPlayer',{name:v('#pn'),code:v('#pc')}));
 if(t){const id=t.id;
  on('#hp',()=>adm('addHearts',{id,amount:n('#ah')}));on('#hm',()=>adm('addHearts',{id,amount:-n('#ah')}));
  on('#ap1',()=>adm('addAp',{id,amount:n('#aa')}));on('#am',()=>adm('addAp',{id,amount:-n('#aa')}));
  on('#rls',()=>adm('setRange',{id,level:n('#rl')}));on('#rnb',()=>adm('rename',{id,name:v('#rn')}));on('#ncb',()=>adm('setCode',{id,code:v('#nc')}));
  on('#rev',()=>adm('revive',{id}));on('#eli',()=>adm('eliminate',{id}));on('#rem',()=>{sel=null;adm('removePlayer',{id})})}
 on('#rz',()=>adm('resize',{width:n('#gw'),height:n('#gh2')}));on('#sn',()=>adm('shrinkNow'));on('#sp',()=>adm('spawnHeart'));
 on('#sv',()=>{const [hh,mm]=v('#s_jc').split(':').map(Number);adm('settings',{apPerDay:n('#s_ap'),maxHearts:v('#s_mh')===''?null:n('#s_mh'),healCost:n('#s_hc'),upgradeCost:n('#s_uc'),shrinkEnabled:$('#s_sh').checked,shrinkEvery:n('#s_se'),juryCloseMinutes:hh*60+mm,endgameMode:v('#s_em')})})}
if(token)start();
